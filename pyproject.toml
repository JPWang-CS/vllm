[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullnet-lab"
version = "0.1.0"
description = "Model-scoped inference, accuracy and operator replacement experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
evaluation = ["transformers>=4.45", "numpy", "tqdm", "nltk", "wonderwords", "tenacity"]
download = ["huggingface-hub>=0.27,<2"]

[project.scripts]
fullnet = "fullnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
